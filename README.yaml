## 🚀 Deployment

To deploy this project:

1. Upload all files to a PHP-compatible web server (like Apache or Nginx with PHP).
2. Ensure the `includes/` folder and `wp-content/` are properly structured.
3. Make sure PHP is installed and the server is configured to serve `.php` files.
4. Optionally, configure `.htaccess` for clean URLs or redirects.

> ⚠️ Netlify does **not support PHP** natively. Consider using [Render](https://render.com), [000webhost](https://www.000webhost.com/), or traditional cPanel hosting instead.

---

## ✍️ Customization

- You can modify the content in the PHP page (e.g., `home.php`) or the included files under `includes/`.
- Images, slider settings, and Elementor content can be customized via the WordPress interface (if integrated), or directly in the HTML.

